# Rebuilt 2026-10-17 (Decision 6, Matt 2026-10-16): the Docker tables
# below were a pasted live `nft list ruleset` dump (xtables-compat
# "xt match"/"xt target" expressions and live packet counters) that
# nft could not load. They are now authored nftables with the same
# tables, chains, policies and rule intent:
#   xt match "addrtype" (LOCAL)      -> fib daddr type local
#   xt target "MASQUERADE"           -> masquerade
#   xt match "conntrack" (DOCKER-CT) -> ct state established,related
#   counter packets N bytes M        -> counter (counts are runtime
#                                       state, not configuration)
# Duplicated rules left by the paste (my_filter input block, forward
# pairs, masquerade lines) are written once. Repo-side only: this file
# is a template, nothing here was applied to a live firewall.
table inet my_filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		iif "lo" accept
		icmpv6 type { mld-listener-query, nd-router-solicit, nd-neighbor-solicit, nd-neighbor-advert } accept
		icmpv6 type echo-request limit rate 10/second burst 5 packets accept
		ip protocol icmp accept
		udp dport 51820 accept
		tcp dport { 22, 80, 389, 443, 636, 2375, 2376, 3000, 9001, 9030, 9050, 9051, 11371, 13340, 13342 } accept
		ct state invalid drop
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
		iifname "wg0" oifname "enp45s0" accept
		iifname "enp45s0" oifname "wg0" accept
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
table inet nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "enp45s0" masquerade
	}
}
table ip6 nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname "enp45s0" masquerade
	}

	chain DOCKER {
	}
	chain PREROUTING {
		type nat hook prerouting priority dstnat; policy accept;
		fib daddr type local counter jump DOCKER
	}
	chain OUTPUT {
		type nat hook output priority dstnat; policy accept;
		ip6 daddr != ::1 fib daddr type local counter jump DOCKER
	}
}
table ip nat {
	chain DOCKER {
		iifname "docker0" counter return
	}

	chain PREROUTING {
		type nat hook prerouting priority dstnat; policy accept;
		fib daddr type local counter jump DOCKER
	}
	chain OUTPUT {
		type nat hook output priority dstnat; policy accept;
		ip daddr != 127.0.0.0/8 fib daddr type local counter jump DOCKER
	}
	chain POSTROUTING {
		type nat hook postrouting priority srcnat; policy accept;
		ip saddr 172.17.0.0/16 oifname != "docker0" counter masquerade
	}
}
table ip filter {
	chain DOCKER {
		iifname != "docker0" oifname "docker0" counter drop
	}

	chain DOCKER-FORWARD {
		counter jump DOCKER-CT
		counter jump DOCKER-ISOLATION-STAGE-1
		counter jump DOCKER-BRIDGE
		iifname "docker0" counter accept
	}
	chain DOCKER-BRIDGE {
		oifname "docker0" counter jump DOCKER
	}
	chain DOCKER-CT {
		oifname "docker0" ct state established,related counter accept
	}
	chain DOCKER-ISOLATION-STAGE-1 {
		iifname "docker0" oifname != "docker0" counter jump DOCKER-ISOLATION-STAGE-2
	}
	chain DOCKER-ISOLATION-STAGE-2 {
		oifname "docker0" counter drop
	}
	chain FORWARD {
		type filter hook forward priority filter; policy accept;
		counter jump DOCKER-USER
		counter jump DOCKER-FORWARD
	}
	chain DOCKER-USER {
		counter return
	}
}
table ip6 filter {
	chain DOCKER {
	}

	chain DOCKER-FORWARD {
		counter jump DOCKER-CT
		counter jump DOCKER-ISOLATION-STAGE-1
		counter jump DOCKER-BRIDGE
	}
	chain DOCKER-BRIDGE {
	}

	chain DOCKER-CT {
	}

	chain DOCKER-ISOLATION-STAGE-1 {
	}

	chain DOCKER-ISOLATION-STAGE-2 {
	}

	chain FORWARD {
		type filter hook forward priority filter; policy accept;
		counter jump DOCKER-USER
		counter jump DOCKER-FORWARD
	}

	chain DOCKER-USER {
		counter return
	}
}
table inet monero {
	chain input {
		type filter hook input priority filter; policy accept;
		tcp dport 18080 accept
		tcp dport 18081 accept
		iif "lo" accept
		ct state established,related accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
		tcp dport { 3333, 10028, 10128 } accept
		oif "lo" accept
		ct state established,related accept
	}
}
